name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        description: "Тег релиза, к которому нужно прикрепить собранные файлы"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-arm64:
    name: macOS aarch64 (.app + .dmg)
    # Не ниже macos-15: Homebrew поддерживает только macOS 15+ и готовых
    # бутылок под Sonoma (14) больше не выпускает — на macos-14 gtk4/
    # libadwaita/librsvg/py3cairo собирались из исходников и падали
    # («python@3.15 not present or broken»).
    runs-on: macos-15
    env:
      # pygobject3/py3cairo из Homebrew собраны только под те версии Python,
      # что формула перечисляет в зависимостях сборки (сейчас 3.14 и 3.15).
      # Под 3.13 их больше нет — venv с --system-site-packages не видел бы gi.
      # 3.14, а не 3.15: её уже поддерживает PyInstaller.
      PYTHON_FORMULA: python@3.14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Явно указываем ref: без него checkout в reusable workflow берёт коммит,
        # который был до бампа версии в release.yml, и версия в собранных
        # файлах отставала от версии в теге релиза на один патч.
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - name: Install Homebrew dependencies
        run: |
          echo "=== DEBUG: Installing Homebrew packages ==="
          brew update
          brew install "$PYTHON_FORMULA" gtk4 libadwaita adwaita-icon-theme \
                        gobject-introspection pygobject3 py3cairo librsvg \
                        gstreamer create-dmg
          brew link --overwrite libadwaita
          brew list --formula | grep -E "($PYTHON_FORMULA|gtk4|libadwaita|gobject-introspection|pygobject3|py3cairo|librsvg|gstreamer)"

      - name: Prepare Homebrew virtual environment
        run: |
          PYTHON_PATH="$(brew --prefix "$PYTHON_FORMULA")/bin/python${PYTHON_FORMULA#python@}"
          "$PYTHON_PATH" -m venv .venv-homebrew --system-site-packages
          source .venv-homebrew/bin/activate
          # Сразу и понятно падаем, если Homebrew снова сменит версию Python
          # у pygobject3, а не через три шага внутри PyInstaller.
          python -c "import gi, cairo; print('PyGObject', gi.__version__, 'for', __import__('sys').version)" \
            || { echo "::error::pygobject3 из Homebrew не собран под $PYTHON_FORMULA — обновите PYTHON_FORMULA"; exit 1; }
          python -m pip install --upgrade pip wheel
          python -m pip install . PyInstaller pyinstaller-hooks-contrib
          pip list | grep -iE "(anime.dlp|PyInstaller)"

      - name: Generate app icon (.icns)
        run: |
          source .venv-homebrew/bin/activate
          chmod +x packaging/macos/make_icns.sh
          ./packaging/macos/make_icns.sh

      - name: Build .app bundle with PyInstaller
        run: |
          source .venv-homebrew/bin/activate
          chmod +x packaging/macos/build.sh
          ./packaging/macos/build.sh

      - name: Determine artifact names
        id: artifact-info
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=AnimeDlp-macOS-${VERSION}-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Set app bundle version
        run: |
          VERSION="${{ steps.artifact-info.outputs.version }}"
          PLIST="dist/AnimeDlp.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$PLIST"

      - name: Verify build outputs
        run: |
          echo "=== DEBUG: dist directory ==="
          ls -la dist/
          if [ ! -d "dist/AnimeDlp.app" ]; then
            echo "=== ERROR: dist/AnimeDlp.app not found ==="
            exit 1
          fi
          if [ ! -x "dist/AnimeDlp.app/Contents/MacOS/AnimeDlp" ]; then
            echo "=== ERROR: AnimeDlp executable missing/not executable ==="
            exit 1
          fi
          echo "=== DEBUG: App bundle size: $(du -sh dist/AnimeDlp.app) ==="

      - name: Smoke-test bundled GUI imports
        run: |
          source .venv-homebrew/bin/activate
          GI_TYPELIB_PATH="dist/AnimeDlp.app/Contents/Frameworks/gi_typelibs" \
          XDG_DATA_DIRS="dist/AnimeDlp.app/Contents/Frameworks/share" \
          python3 -c "
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('Adw', '1')
          from gi.repository import Adw, Gtk
          Adw.init()
          print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())
          print('Adwaita', Adw.MAJOR_VERSION, Adw.MINOR_VERSION)
          "

      - name: Create .dmg installer
        run: |
          DMG_NAME="${{ steps.artifact-info.outputs.dmg }}"
          create-dmg \
            --volname "AnimeDlp" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AnimeDlp.app" 150 190 \
            --app-drop-link 450 190 \
            "dist/$DMG_NAME" \
            "dist/AnimeDlp.app" || true
          if [ ! -f "dist/$DMG_NAME" ]; then
            echo "=== ERROR: DMG not created ==="
            ls -la dist/
            exit 1
          fi

      - name: Generate DMG checksum
        run: |
          DMG_NAME="${{ steps.artifact-info.outputs.dmg }}"
          shasum -a 256 "dist/$DMG_NAME" > "dist/$DMG_NAME.sha256"
          cat "dist/$DMG_NAME.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-dlp-${{ steps.artifact-info.outputs.version }}-macos-arm64-dmg
          path: dist/${{ steps.artifact-info.outputs.dmg }}

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            dist/${{ steps.artifact-info.outputs.dmg }}
            dist/${{ steps.artifact-info.outputs.dmg }}.sha256
