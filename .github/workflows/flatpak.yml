name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        description: "Тег релиза, к которому нужно прикрепить собранный файл"
        required: false
        type: string

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # Явно указываем ref: без него checkout в reusable workflow берёт коммит,
        # который был до бампа версии в release.yml, и версия в собранных
        # файлах отставала от версии в теге релиза на один патч.
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - name: Determine artifact name
        id: artifact-info
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d)
          fi
          echo "bundle=anime-dlp-${VERSION}.flatpak" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        id: flatpak-builder
        with:
          bundle: ${{ steps.artifact-info.outputs.bundle }}
          manifest-path: flatpak/io.github.alttux.AnimeDlp.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-info.outputs.bundle }}
          path: ${{ steps.artifact-info.outputs.bundle }}

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ${{ steps.artifact-info.outputs.bundle }}
