name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        description: "Тег релиза, к которому нужно прикрепить собранный файл"
        required: false
        type: string

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        id: flatpak-builder
        with:
          bundle: anime-dlp.flatpak
          manifest-path: flatpak/io.github.alttux.AnimeDlp.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: anime-dlp.flatpak
