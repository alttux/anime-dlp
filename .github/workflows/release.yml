name: Create Release

# Единая точка версионирования проекта. При каждом пуше в main, который
# затрагивает код (не только доки), этот workflow сам увеличивает
# patch-версию в pyproject.toml (и синхронизированном
# data/io.github.alttux.AnimeDlp.metainfo.xml) через scripts/bump_version.py,
# коммитит и пушит это изменение обратно в main от имени github-actions[bot]
# — версия больше нигде вручную не бампается (ни разработчиком, ни
# build.sh/flatpak/build.sh). Затем создаёт и пушит тег v<версия>, создаёт
# под него GitHub Release (`gh release create`, с автоматически
# сгенерированными release notes) и запускает сборки Windows/macOS/Flatpak
# как reusable workflows — они прикрепляют собранные файлы (со встроенной
# версией — см. windows-build.yml/macos-build.yml) к уже существующему
# релизу.
#
# Пуш от GITHUB_TOKEN не запускает workflow'ы повторно (стандартная защита
# GitHub Actions от бесконечных циклов), но на случай нестандартных
# настроек репозитория есть и собственная защита: если последний коммит
# сделан github-actions[bot] (т.е. это уже сам коммит с бампом версии),
# новый бамп не выполняется. Проверка идёт по автору коммита, а не по
# тексту сообщения — подстрока в тексте (например, в этом самом описании)
# не должна давать ложных срабатываний.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.MD"
      - "LICENSE.txt"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version and tag if this isn't our own bump commit
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_AUTHOR_EMAIL=$(git log -1 --pretty=%ae)
          if [ "$LAST_AUTHOR_EMAIL" = "github-actions[bot]@users.noreply.github.com" ]; then
            echo "Последний коммит уже сделан github-actions[bot] (автоматический бамп версии) — пропускаю"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/bump_version.py
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "Не удалось прочитать version из pyproject.toml" >&2
            exit 1
          fi
          TAG="v${VERSION}"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже существует — релиз не нужен"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${VERSION} [auto-version]"
          git push origin HEAD:main

          echo "Создаю тег $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes

  windows:
    name: Windows artifacts
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/windows-build.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag }}

  macos:
    name: macOS artifacts
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/macos-build.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag }}

  flatpak:
    name: Flatpak artifact
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag }}
