name: Windows & macOS build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Собирает автономный исполняемый файл CLI (без GUI) через PyInstaller.
  # GTK4/libadwaita не бандлятся сюда — см. джобы gui-*, которые проверяют
  # графический интерфейс через нативные пакетные менеджеры платформы.
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: anime-dlp-windows-x86_64.exe
            dist-name: anime-dlp.exe
          - os: macos-latest
            asset: anime-dlp-macos-arm64
            dist-name: anime-dlp
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anime-dlp and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --onefile --name anime-dlp \
            --collect-all anime_parsers_ru \
            packaging/pyinstaller_entry.py

      - name: Smoke test
        run: dist/${{ matrix.dist-name }} --help

      - name: Rename artifact
        run: mv dist/${{ matrix.dist-name }} ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  # Устанавливает GTK4/libadwaita/PyGObject через нативный пакетный менеджер
  # платформы (в pip таких колёс нет) и проверяет, что anime-dlp и его GUI
  # действительно импортируются и запускаются на этой ОС.
  gui-windows:
    name: GUI smoke test (windows-latest, MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gsettings-desktop-schemas
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-hicolor-icon-theme

      - name: Install anime-dlp
        run: python -m pip install --no-build-isolation --break-system-packages ".[gui]"

      - name: CLI smoke test
        run: anime-dlp --help

      - name: GUI import smoke test
        run: |
          python -c "
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('Adw', '1')
          from gi.repository import Adw, Gtk
          Adw.init()
          print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())
          print('Adwaita', Adw.MAJOR_VERSION, Adw.MINOR_VERSION)
          "

  gui-macos:
    name: GUI smoke test (macos-latest, Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4/libadwaita/PyGObject via Homebrew
        run: brew install gtk4 libadwaita pygobject3 adwaita-icon-theme gobject-introspection

      - name: Create venv with access to Homebrew's PyGObject
        run: |
          "$(brew --prefix python@3.13 2>/dev/null || brew --prefix python3)/bin/python3" \
            -m venv --system-site-packages .venv

      - name: Install anime-dlp
        run: |
          source .venv/bin/activate
          pip install .

      - name: CLI smoke test
        run: |
          source .venv/bin/activate
          anime-dlp --help

      - name: GUI import smoke test
        run: |
          source .venv/bin/activate
          python3 -c "
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('Adw', '1')
          from gi.repository import Adw, Gtk
          Adw.init()
          print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())
          print('Adwaita', Adw.MAJOR_VERSION, Adw.MINOR_VERSION)
          "
