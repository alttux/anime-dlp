name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        description: "Тег релиза, к которому нужно прикрепить собранные файлы"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Windows CLI (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Явно указываем ref: без него checkout в reusable workflow берёт коммит,
        # который был до бампа версии в release.yml, и версия в собранных
        # файлах отставала от версии в теге релиза на один патч.
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anime-dlp and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Determine artifact name
        id: artifact-info
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=anime-dlp-windows-x86_64-${VERSION}.exe" >> "$GITHUB_OUTPUT"

      - name: Generate Windows version resource
        shell: bash
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.artifact-info.outputs.version }}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          cat > version_info.txt <<EOF
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($MAJOR, $MINOR, $PATCH, 0),
              prodvers=($MAJOR, $MINOR, $PATCH, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo(
                [
                StringTable(
                  u'040904B0',
                  [StringStruct(u'CompanyName', u'alttux'),
                  StringStruct(u'FileDescription', u'Anime Downloader (CLI)'),
                  StringStruct(u'FileVersion', u'${{ steps.artifact-info.outputs.version }}.0'),
                  StringStruct(u'InternalName', u'anime-dlp'),
                  StringStruct(u'LegalCopyright', u'MIT License'),
                  StringStruct(u'OriginalFilename', u'anime-dlp.exe'),
                  StringStruct(u'ProductName', u'anime-dlp'),
                  StringStruct(u'ProductVersion', u'${{ steps.artifact-info.outputs.version }}.0')])
                ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          EOF

      - name: Build standalone executable
        run: |
          pyinstaller --onefile --name anime-dlp `
            --collect-all anime_parsers_ru `
            --copy-metadata anime-dlp `
            --version-file version_info.txt `
            packaging/pyinstaller_entry.py

      - name: Smoke test
        run: |
          .\dist\anime-dlp.exe --help
          .\dist\anime-dlp.exe --version

      - name: Rename artifact
        shell: bash
        run: mv dist/anime-dlp.exe "${{ steps.artifact-info.outputs.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-info.outputs.asset }}
          path: ${{ steps.artifact-info.outputs.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ${{ steps.artifact-info.outputs.asset }}

  build-gui:
    name: Windows GUI (.exe, PyQt6)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Явно указываем ref: без него checkout в reusable workflow берёт коммит,
        # который был до бампа версии в release.yml, и версия в собранных
        # файлах отставала от версии в теге релиза на один патч.
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anime-dlp[gui] and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]"
          pip install pyinstaller

      - name: Determine artifact name
        id: artifact-info
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=anime-dlp-gui-windows-x86_64-${VERSION}.exe" >> "$GITHUB_OUTPUT"

      - name: Generate Windows version resource
        shell: bash
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.artifact-info.outputs.version }}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          cat > version_info.txt <<EOF
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($MAJOR, $MINOR, $PATCH, 0),
              prodvers=($MAJOR, $MINOR, $PATCH, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo(
                [
                StringTable(
                  u'040904B0',
                  [StringStruct(u'CompanyName', u'alttux'),
                  StringStruct(u'FileDescription', u'Anime Downloader (GUI)'),
                  StringStruct(u'FileVersion', u'${{ steps.artifact-info.outputs.version }}.0'),
                  StringStruct(u'InternalName', u'anime-dlp-gui'),
                  StringStruct(u'LegalCopyright', u'MIT License'),
                  StringStruct(u'OriginalFilename', u'anime-dlp-gui.exe'),
                  StringStruct(u'ProductName', u'anime-dlp'),
                  StringStruct(u'ProductVersion', u'${{ steps.artifact-info.outputs.version }}.0')])
                ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          EOF

      - name: Import check
        run: python -c "import anime_dlp.gui.qt.app"

      - name: Build standalone GUI executable
        run: |
          pyinstaller --onefile --windowed --name anime-dlp-gui `
            --icon packaging/windows/AnimeDlp.ico `
            --collect-all anime_parsers_ru `
            --copy-metadata anime-dlp `
            --version-file version_info.txt `
            --add-data "src/anime_dlp/gui/assets/genre_posters;anime_dlp/gui/assets/genre_posters" `
            packaging/windows_gui_entry.py

      - name: Rename artifact
        shell: bash
        run: mv dist/anime-dlp-gui.exe "${{ steps.artifact-info.outputs.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-info.outputs.asset }}
          path: ${{ steps.artifact-info.outputs.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ${{ steps.artifact-info.outputs.asset }}
